# S2 -- morphological control via the initialization length l0 (Fig. 3 / Sec. 2.2)
#
# Method in force (docs/STUDIES.md, docs/algorithm/ckai_algorithm.pdf; Robin
# 2026-09-28: "all like S1"): contrast 1000, corrected gradient, density filter
# + Heaviside projection, sharp start, N = 256 for generation and evaluation.
#
# Design: C-Kai at f = 0.3, l0 swept over the three published values
# (0.015 / 0.03 / 0.05) plus 0.02 (the S1 recipe), 0.08 and 0.12, 3 seeds each.
# The density-filter radius is held FIXED at r_f = 0.005 (the recipe's minimum
# feature size) so that l0 is the only length that changes; with the sharp
# start, r_cov stays at the scale imprinted by l0 as long as l0 >= ~3 r_f
# (OQ-27, OQ-31). The old design (l0 = 4 l_g with gradient smoothing, N = 64,
# contrast 100) is superseded; its runs stay in results/S2 and are filtered out
# by phase_contrast.
# References (f = 0.3, same method): Gyroid and the 5 canonical RSA of S1.
#
# Second series (Robin, 2026-09-29: "coarsening the microstructure is in fact
# the objective"): r_f proportional to l0, r_f = l0 / rf_ratio with rf_ratio = 4
# (the manuscript's l0 = 4 l_g ratio for closed kairotops). The l0 = 0.02 point
# (r_f = 0.005) coincides with the fixed series and is shared.

study_id = "S2"

[dev]
N = 64
fraction = 0.3
l0_values = [0.04, 0.06, 0.08]
seeds = [1]
density_filter_radius = 0.02

[prod]
N = 256
phase_contrast = 1000
fraction = 0.3
l0_values = [0.015, 0.02, 0.03, 0.05, 0.08, 0.12]
seeds = [1, 2, 3]
density_filter_radius = 0.005
rf_ratio = 4.0
